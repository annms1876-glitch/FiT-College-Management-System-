<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vanguard Institute of Technology, Pune — AI-powered College Administration Portal for AY 2026-27." />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Vanguard Institute Portal · Admin</title>
    <script>
      // Apply persisted theme before paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('vanguard-theme');
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
